<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(poppins-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:P;src:url(poppins-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:M;src:url(jetbrains-mono-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:M;src:url(jetbrains-mono-latin-500-normal.woff2);font-weight:500}
*{margin:0;box-sizing:border-box}body{width:1280px;font-family:P}
.t{position:relative;width:1280px;height:720px;overflow:hidden}
.k{font-family:M;font-weight:500;letter-spacing:.28em;font-size:22px;text-transform:uppercase}
/* A */
.A{background:#0D182E;color:#fff}
.A .img{position:absolute;right:-40px;top:90px;width:760px;height:540px;background-size:cover;background-position:center;border-radius:18px;border:2px solid #23406f;box-shadow:0 0 80px rgba(0,125,255,.25)}
.A .n{position:absolute;left:64px;top:120px;font-family:M;font-weight:700;font-size:170px;color:#007DFF;line-height:1}
.A h1{position:absolute;left:64px;top:330px;width:500px;font-size:66px;line-height:1.02;letter-spacing:-.01em}
.A h1 b{color:#62A5F4}
.A .k{position:absolute;left:66px;top:70px;color:#62A5F4}
.A .lg{position:absolute;left:64px;bottom:52px;height:40px}
/* B */
.B{background:#0D182E;color:#fff}
.B .img{position:absolute;inset:0;background-size:cover;background-position:center}
.B .sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,16,32,.97) 0%,rgba(9,16,32,.85) 40%,rgba(9,16,32,.1) 75%)}
.B .tag{position:absolute;left:64px;top:64px;background:#007DFF;color:#fff;font-family:M;font-weight:700;font-size:24px;padding:10px 18px;border-radius:8px;letter-spacing:.12em}
.B h1{position:absolute;left:64px;bottom:120px;width:640px;font-size:84px;line-height:1;letter-spacing:-.015em}
.B h1 b{color:#62A5F4}
.B .lg{position:absolute;left:64px;bottom:50px;height:38px}
/* C */
.C{background:#F7F6F2;color:#0D182E}
.C .img{position:absolute;right:56px;top:72px;width:640px;height:576px;background-size:cover;background-position:center;border-radius:20px}
.C .k{position:absolute;left:64px;top:84px;color:#0060C7}
.C .n{position:absolute;left:64px;top:140px;font-family:M;font-weight:700;font-size:64px;color:#0D182E;opacity:.25}
.C h1{position:absolute;left:64px;top:240px;width:500px;font-size:68px;line-height:1.02;letter-spacing:-.01em}
.C h1 b{color:#0060C7}
.C .lg{position:absolute;left:64px;bottom:64px;height:40px}

.D{background:#F7F6F2;color:#0D182E}
.D .img{position:absolute;right:0;top:0;width:820px;height:720px;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 45%);}
.D .k{position:absolute;left:64px;top:84px;color:#0060C7}
.D .n{position:absolute;left:64px;top:140px;font-family:M;font-weight:700;font-size:64px;color:#0D182E;opacity:.25}
.D h1{position:absolute;left:64px;top:240px;width:520px;font-size:72px;line-height:1.02;letter-spacing:-.01em}
.D h1 b{color:#0060C7}
.D .lg{position:absolute;left:64px;bottom:64px;height:40px}
.E{background:#F7F6F2;color:#0D182E}
.E .img{position:absolute;right:40px;top:60px;width:700px;height:600px;background-size:cover;background-position:center;-webkit-mask-image:radial-gradient(ellipse 60% 62% at 55% 50%,#000 55%,transparent 100%)}
.E .k{position:absolute;left:64px;top:84px;color:#0060C7}
.E .n{position:absolute;left:64px;top:140px;font-family:M;font-weight:700;font-size:64px;color:#0D182E;opacity:.25}
.E h1{position:absolute;left:64px;top:240px;width:520px;font-size:72px;line-height:1.02;letter-spacing:-.01em}
.E h1 b{color:#0060C7}
.E .lg{position:absolute;left:64px;bottom:64px;height:40px}

.F{background:#F7F6F2;color:#0D182E}
.F .img{position:absolute;right:0;top:0;width:860px;height:720px;background-size:cover;background-position:center;filter:invert(1) hue-rotate(180deg) contrast(1.15);mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 40%)}
.F .k{position:absolute;left:64px;top:84px;color:#0060C7}
.F .n{position:absolute;left:64px;top:140px;font-family:M;font-weight:700;font-size:64px;color:#0D182E;opacity:.25}
.F h1{position:absolute;left:64px;top:240px;width:520px;font-size:72px;line-height:1.02;letter-spacing:-.01em}
.F h1 b{color:#0060C7}
.F .lg{position:absolute;left:64px;bottom:64px;height:40px}
</style></head><body>
<script>
const V=[['01','c01.jpg','Prepare your <b>chart</b>'],['03','c03.jpg','Rejection <b>at the zone</b>'],['06','c06.jpg','Positive vs negative <b>gamma</b>']];
let h='';
for(const [n,img,t] of V){
 h+=`<div class="t A" id="A${n}"><div class="k">FXMM Education</div><div class="n">${n}</div><h1>${t}</h1><div class="img" style="background-image:url(${img})"></div><img class="lg" src="logoW.png"></div>`;
 h+=`<div class="t B" id="B${n}"><div class="img" style="background-image:url(${img})"></div><div class="sh"></div><div class="tag">EDUCATION ${n}</div><h1>${t}</h1><img class="lg" src="logoW.png"></div>`;
 h+=`<div class="t C" id="C${n}"><div class="k">FXMM Education</div><div class="n">${n}</div><h1>${t}</h1><div class="img" style="background-image:url(${img})"></div><img class="lg" src="logoD.png"></div>`;
}
for(const [n,img,t] of V){for(const S of ['D','E','F']) h+=`<div class="t ${S}" id="${S}${n}"><div class="img" style="background-image:url(${img})"></div><div class="k">FXMM Education</div><div class="n">${n}</div><h1>${t}</h1><img class="lg" src="logoD.png"></div>`;}
document.body.innerHTML=h;
</script></body></html>
