html,body{margin:0;background:#0a1224}canvas{display:block}</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script src="engine.js"></script><script>
const TLJ={"L": [1.4, 10.091, 14.613, 21.091, 29.25, 36.326, 42.35, 49.302], "D": [7.741, 2.972, 5.528, 7.209, 5.626, 5.074, 5.702, 9.349], "body": 59.85, "total": 63.25};const L=TLJ.L,D=TLJ.D,BODY=TLJ.body;
const ZT=1.09024,ZB=1.08724;
const M15=series([[0,1.0950],[40,1.0962],[80,1.0948],[120,1.0957],[160,1.0935],[200,1.0926]],202);
// H1 with clear structure: swing low (21), order block (23), FVG (23..25)
const HC=[1.0948,1.0944,1.0946,1.0940,1.0936,1.0938,1.0933,1.0929,1.0931,1.0926,1.0921,1.0923,1.0918,1.0914,1.0916,1.0910,1.0906,1.0903,1.0899,1.0897,1.0893,1.0884,1.0888,1.0880,1.0913,1.0921,1.0926,1.0924,1.0931,1.0936,1.0934,1.0941,1.0946,1.0944,1.0950,1.0955,1.0953,1.0958];
const H1=buildC(HC,1.0951,9,{21:{l:1.08762},22:{o:1.0884,l:1.08800},23:{o:1.0888,h:1.08900,l:1.08785},24:{o:1.0880,l:1.08790,h:1.09150},25:{o:1.0913,l:1.09098}});
const NS=series([[0,1.0950],[20,1.0960],[40,1.0942],[60,1.0957],[85,1.0928],[100,1.0912]],77);
const hx0=170,hsp=36,hw=22;const XI=i=>hx0+i*hsp;
window.draw=function(T){X.clearRect(0,0,1920,1080);
 const S1=L[1]-0.5,S6=L[6]-0.4,S7=L[7]-0.4;
 // ---------- opening: H1 chart streaming + title + quote ----------
 if(T<S1){
  view(1.0862,1.0985);background(null);grid();

  const out=1-ramp(T,S1-0.6,.45);

  kicker('FXMM EDUCATION · 02',120,250,ramp(T,0.2)*out);
  bigLine('Check your H1',120,345,104,'#fff',ramp(T,0.4,.6),(1-ramp(T,0.4,.6))*60,out);
  label(120,450,'From your report:',ramp(T,L[0]-0.1)*out,{f:'500 30px P',c:'rgb(150,170,200)',align:'left'});
  const q=[['“While you wait, check your own H1 chart:',0],['a swing low, an Order Block or a Fair Value Gap',2.4],['lining up with the zone would add weight.”',5.0]];
  q.forEach(([s,d],i)=>label(120,520+i*62,s,ramp(T,L[0]+d,.5)*out,{f:'400 40px P',align:'left'}));
  if(T>S1-0.45) fadeTo(T,S1-0.45,S1);return}
 // ---------- M15: mark the zone, then switch to H1 ----------
 const SW=L[2]+0.4; // switch moment
 if(T<SW+0.9){
  view(1.0862,1.0985);background(T<SW+0.45?'M15':'H1');grid();

  if(sw<0.5){drawSeries(M15,lerpK(T,[[S1,170],[SW,182]]),{sp:12,w:7});}
  zoneBand(ZT,ZB,{top:ramp(T,L[1]+0.3,.6),bot:ramp(T,L[1]+0.8,.6),fill:ramp(T,L[1]+1.2,.5),tags:ramp(T,L[1]+1.0,.4)});
  level(1.08870,'CME Volume Node',ramp(T,L[1]+1.8,.6));
  tfChips(sw);
  if(sw>0){X.globalAlpha=Math.sin(sw*Math.PI);X.fillStyle='rgb(9,16,32)';X.fillRect(0,0,1920,1080);X.globalAlpha=1}
  if(T<S1+0.3) fadeFrom(T,S1,S1+0.3);return}
 // ---------- H1: scroll back, structure ----------
 if(T<S6){
  view(1.0862,1.0985);background('H1');grid();
  const back=lerpK(T,[[SW+0.9,0],[SW+3.2,1]]); // scroll back in time
  const off=(1-back)*-420;
  X.save();X.translate(off,0);
  drawFixed(H1,hx0,hsp,hw,H1.length);
  X.restore();
  zoneBand(ZT,ZB,{top:1,bot:1,fill:1,tags:1});tfChips(1);
  if(back<1){label(1300,250,'◀◀  scrolling back',1-ramp(T,SW+3.0,.3),{f:'500 28px P',c:'rgb(150,195,245)'})}
  // swing low
  const a1=ramp(T,L[3]+0.8);ring(XI(21),Y(1.08762)+20,a1);label(XI(21),Y(1.08762)+62,'Swing low',a1,{f:'500 30px P'});
  hlineX(XI(21),XI(37),1.08762,ramp(T,L[3]+1.6,.8)*0.8);
  // order block
  boxLabel(XI(23)-hw/2,1.08900,XI(37),1.08785,'Order Block',ramp(T,L[4]+0.4,.8),'rgba(255,255,255,.07)');
  // fvg
  boxLabel(XI(24)+hw/2+2,1.09098,XI(37),1.08900,'Fair Value Gap',ramp(T,L[5]+0.4,.8));
  if(T<SW+1.2) fadeFrom(T,SW+0.9,SW+1.2);
  if(T>S6-0.35) fadeTo(T,S6-0.35,S6);return}
 // ---------- no structure ----------
 if(T<S7){
  view(1.0862,1.0985);background('H1');grid();
  drawSeries(NS,lerpK(T,[[S6,88],[S7,100]]),{sp:15,w:9});
  zoneBand(ZT,ZB,{top:1,bot:1,fill:1,tags:1});tfChips(1);
  const pa=ramp(T,L[6]+0.3);panel(150,250,620,300,pa);
  label(180,300,'Nothing on H1 lines up with the zone',pa,{f:'600 28px P',align:'left'});
  ['Swing low','Order Block','Fair Value Gap'].forEach((s,i)=>{const a=ramp(T,L[6]+0.8+i*0.4);label(190,370+i*56,'✕',a,{f:'600 30px P',c:'rgb(230,110,110)',align:'left'});label(240,370+i*56,s,a,{f:'400 30px P',c:'rgb(200,205,215)',align:'left'})});
  pill('Be more careful',460,610,ramp(T,L[6]+D[6]-1.3));
  if(T<S6+0.3) fadeFrom(T,S6,S6+0.3);
  if(T>S7-0.35) fadeTo(T,S7-0.35,S7);return}
 // ---------- recap ----------
 if(T<BODY){
  view(1.0862,1.0985);background('H1');grid();drawFixed(H1,hx0,hsp,hw,H1.length);
  zoneBand(ZT,ZB,{top:1,bot:1,fill:1,tags:1});tfChips(1);
  ring(XI(21),Y(1.08762)+20,1);label(XI(21),Y(1.08762)+62,'Swing low',1,{f:'500 30px P'});
  boxLabel(XI(23)-hw/2,1.08900,XI(37),1.08785,'Order Block',1,'rgba(255,255,255,.07)');boxLabel(XI(24)+hw/2+2,1.09098,XI(37),1.08900,'Fair Value Gap',1);
  pill('Adds weight',1300,300,ramp(T,L[7]+0.6)*(1-ramp(T,L[7]+2.6)));
  pill('No structure: more caution',1300,300,ramp(T,L[7]+3.0)*(1-ramp(T,L[7]+5.8)));
  const fa=ramp(T,L[7]+6.3,.5);if(fa>0){X.globalAlpha=fa*.85;X.fillStyle='rgb(9,16,32)';X.fillRect(0,0,1920,1080);X.globalAlpha=1;centerText([['This isn’t the entry. ','#fff'],['It’s preparation.',BLUE_T]],540,64,fa)}
  if(T<S7+0.3) fadeFrom(T,S7,S7+0.3);
  if(T>BODY-0.35) fadeTo(T,BODY-0.35,BODY);return}
 endCard(T-BODY,'Better preparation. Clearer decisions.');
};
function hlineX(x1,x2,p,a){if(a<=0)return;X.globalAlpha=a;X.setLineDash([7,6]);X.strokeStyle='rgba(255,255,255,.7)';X.lineWidth=2;X.beginPath();X.moveTo(x1,Y(p));X.lineTo(x1+(x2-x1)*cl(a*1.3),Y(p));X.stroke();X.setLineDash([]);X.globalAlpha=1}
</script></body></html>
