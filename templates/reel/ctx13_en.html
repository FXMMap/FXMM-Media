<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;font-weight:400;src:url(poppins-latin-400-normal.woff2)}
@font-face{font-family:P;font-weight:500;src:url(poppins-latin-500-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(poppins-latin-700-normal.woff2)}
@font-face{font-family:I;font-weight:400;src:url(inter-latin-400-normal.woff2)}
@font-face{font-family:I;font-weight:600;src:url(inter-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(jetbrains-mono-latin-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#F4F6F9;font-family:P;color:#121821;position:relative}
.wm{position:absolute;right:-200px;bottom:-140px;width:900px;height:652px;background:url(wmD.png) center/contain no-repeat}
.k{position:absolute;left:90px;top:250px;font-size:24px;font-weight:600;letter-spacing:5px;color:#0060C7}
h1{position:absolute;left:88px;right:88px;top:300px;font-size:92px;line-height:1.08;font-weight:700;letter-spacing:-2px}
h1 b{color:#0060C7;font-weight:700}
.line{position:absolute;left:90px;right:90px;top:1560px;height:1px;background:#E1E5EB}
.logo{position:absolute;left:90px;top:1600px;height:52px}
.url{position:absolute;right:90px;top:1610px;font-size:30px;color:#121821}
.note{position:absolute;left:90px;top:1515px;font-family:M;font-size:20px;letter-spacing:1px;color:#8A96A8}
.ab{position:absolute}
.card{background:#fff;border:1px solid #E1E5EB;border-radius:22px;box-shadow:0 18px 50px rgba(13,24,46,.08)}
.mono{font-family:M}
.lbl{font-family:M;font-weight:700;font-size:22px;letter-spacing:2px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:12px;background:rgba(0,96,199,.09);border:1.5px solid #0060C7;color:#0060C7;font-weight:600;font-size:28px;margin-right:12px}
.end{position:absolute;inset:0;z-index:5;background:#F4F6F9;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;padding:0 90px}
.end h2{font-size:84px;font-weight:700;letter-spacing:-1.8px;text-align:center;line-height:1.12}
.end h2 b{color:#0060C7}
.end p{margin-top:40px;font-size:34px;color:#3A4556;text-align:center;line-height:1.5}
.end img{height:78px;margin-top:80px}
.end .u{margin-top:26px;font-family:M;font-size:32px}
</style></head><body style="background:#0D182E;color:#EEF1F6">
<div class="wm" style="background-image:url(wmN.png);opacity:.5"></div>
<div id="hook" class="ab" style="left:80px;right:80px;top:250px"></div>
<div id="chart" class="ab" style="left:80px;top:660px;width:920px;height:600px">
 <svg width="920" height="760" style="position:absolute;left:0;top:0;overflow:visible">
  <g id="cg"></g>
  <g id="entry" style="opacity:0"><line id="el" stroke="#B9C3D6" stroke-width="3" stroke-dasharray="12 10"/><polygon id="ep" fill="#3FD08F"/><text id="et" font-family="M" font-weight="700" font-size="28" letter-spacing="2" fill="#3FD08F">YOU BOUGHT HERE</text></g>
 </svg>
</div>
<div id="qs" class="ab card" style="left:80px;top:700px;width:920px;padding:44px 44px;opacity:0;background:#15213A;border-color:#22304A;box-shadow:none"></div>
<div class="note" style="left:80px;top:1290px;color:#7D8AA3;font-family:M;font-size:22px">ILLUSTRATIVE EXAMPLE</div>
<div id="sub" class="ab" style="left:80px;right:80px;top:1340px;text-align:center;z-index:9"><span id="subt" style="display:inline-block;background:rgba(0,0,0,.55);color:#fff;font-family:I;font-weight:600;font-size:46px;line-height:1.3;padding:14px 26px;border-radius:14px"></span></div>
<div class="end" id="end" style="background:#0D182E"><h2 style="color:#fff">Context<br><b style="color:#62A5F4">before you enter.</b></h2><p style="color:#B9C3D6">Zones of interest on the 7 major FX pairs<br>Waitlist open · Opening November 15</p><img src="logoW.png" style="height:84px;margin-top:80px"><div class="u" style="color:#EEF1F6">fxmarketmap.com</div></div>
<script>
const $=s=>document.querySelector(s);const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};const seg=(t,a,b)=>ease((t-a)/(b-a));
const TM={h1:2.35,h2:6.15,q:[8.55,9.95,12.2],end:14.2};
const H=[[0,TM.h1,'Entered late.','Again.',132],[TM.h1,TM.h2,'It wasn\'t bad luck.','You entered without context.',96],[TM.h2,TM.end,'Before you enter,','ask yourself:',104]];
$('#hook').innerHTML=H.map((h,i)=>`<div id="h${i}" style="position:absolute;left:0;right:0;top:0;opacity:0"><div style="font-weight:700;font-size:${h[4]}px;line-height:1.05;letter-spacing:-3px;color:#fff">${h[2]}</div><div style="font-weight:700;font-size:${h[4]}px;line-height:1.05;letter-spacing:-3px;color:#62A5F4">${h[3]}</div></div>`).join('');
const Q=['Why this level?','How are large traders positioned?','Is there real volume there?'];
$('#qs').innerHTML=Q.map((q,i)=>`<div class="q" id="q${i}" style="opacity:0;display:flex;gap:28px;align-items:center;font-weight:600;font-size:46px;line-height:1.2;color:#fff;margin:${i?42:0}px 0 0"><span style="flex:none;width:64px;height:64px;border-radius:50%;border:3px solid #62A5F4;color:#62A5F4;display:flex;align-items:center;justify-content:center;font-family:M;font-size:30px">${i+1}</span>${q}</div>`).join('');
const C=[470,458,466,430,405,413,368,335,298,272,226,188,150, 172,214,260,310,352,394,428,452,486,504];
const N=C.length,cw=920/(N+1);let s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280};let g='';const T=[];
for(let i=0;i<N;i++){const o=i?C[i-1]:535,c=C[i],x=(i+.8)*cw,up=c<o,col=up?'#15875B':'#CC3A3F';const hi=Math.min(o,c)-6-r()*16,lo=Math.max(o,c)+6+r()*16;
 g+=`<g class="cd" style="opacity:0"><line x1="${x}" x2="${x}" y1="${hi}" y2="${lo}" stroke="${col}" stroke-width="4"/><rect x="${x-cw*.33}" y="${Math.min(o,c)}" width="${cw*.66}" height="${Math.max(4,Math.abs(c-o))}" fill="${col}" rx="2"/></g>`;
 T.push(i<=12? Math.max(0,i-6)*0.27 : TM.h1+(i-13)*0.25);}
$('#cg').innerHTML=g;
const ex=(12+.8)*cw, ey=150;$('#el').setAttribute('x1',ex);$('#el').setAttribute('x2',920);$('#el').setAttribute('y1',ey);$('#el').setAttribute('y2',ey);$('#ep').setAttribute('points',`${ex-26},${ey} ${ex-58},${ey-20} ${ex-58},${ey+20}`);$('#et').setAttribute('x',ex-350);$('#et').setAttribute('y',ey-36);
const SUB=[[0,2.35,'¿Entraste tarde? Otra vez.'],[2.4,3.95,'No fue mala suerte.'],[3.95,6.15,'Entraste sin contexto.'],[6.15,8.5,'Antes de entrar, pregúntate:'],[8.5,9.95,'¿Por qué este nivel?'],[9.95,12.15,'¿Cómo están posicionados los grandes?'],[12.15,14.15,'¿Hay volumen real ahí?'],[14.2,16.6,'Contexto antes de entrar.']];
window.R=t=>{
 const cur=SUB.find(x=>t>=x[0]&&t<x[1]);$('#subt').textContent=cur?cur[2]:'';$('#sub').style.opacity=cur?1:0;
 H.forEach((h,i)=>{let v=i==0?(t<h[1]?1:0):Math.min(1,cl((t-h[0])/0.18))*(t<h[1]?1:0);$('#h'+i).style.opacity=v;});
 $('#h0').style.transform=t<0.25?`scale(${0.94+0.06*cl(t/0.25)})`:'none';$('#h0').style.transformOrigin='left top';
 document.querySelectorAll('.cd').forEach((c,i)=>c.style.opacity=t>=T[i]?1:0);
 $('#entry').style.opacity=t>=1.62?1:0;
 $('#chart').style.opacity=1-seg(t,TM.h2,TM.h2+0.35);
 $('#qs').style.opacity=seg(t,TM.h2+0.15,TM.h2+0.5);
 TM.q.forEach((a,i)=>{const e=$('#q'+i);e.style.opacity=seg(t,a,a+0.3);e.style.transform=`translateY(${(1-seg(t,a,a+0.3))*20}px)`});
 $('#end').style.opacity=seg(t,TM.end,TM.end+0.35);
};R(0);
</script></body></html>
